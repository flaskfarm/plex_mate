{% extends "base.html" %}
{% block content %}
<div class='row' style="padding-top: 5px; padding-bottom:5px; align-items: center;">
  <div class='col-sm-1 set-left'>
    <strong>Library</strong>
  </div>
  <div class="input-group col-sm-2">
    <select id="library_select" name="library_select" class="form-control form-control-sm">
      {% if arg['library_list'] is not none %}
      {% for item in arg['library_list'] %}
        {% if loop.counter == 0 %}
        <option value="{{ item['id'] }}" selected>{{item['name']}}</option>
        {% else %}
        <option value="{{ item['id'] }}">{{item['name']}}</option>
        {% endif %}
      {% endfor %}
      {% endif %}
    </select>
  </div>
  <div class='col-sm-1 set-left'>
    <strong>경로</strong>
  </div>
  <div class="input-group col-sm-2">
    <div id="section_location_div"></div>
  </div>
  
  <div class="col-sm-6" style="padding-left:0px; padding-top:5px">
    <div class="btn-group btn-group-sm flex-wrap mr-2" role="group" style="padding-left:5px; padding-top:0px">
      <button id="stop_btn" class="btn btn-sm btn-outline-danger">중지</button>
      <button id="start0_btn" class="btn btn-sm btn-outline-secondary">파일시스템 기준</button>
      <button id="start2_btn" class="btn btn-sm btn-outline-primary">DB 죽은자막 정리 (1·2단계)</button>
      <button id="start3_btn" class="btn btn-sm btn-outline-info">DB 외화자막 진단 (3단계)</button>
      <button id="start1_btn" class="btn btn-sm btn-outline-success">DB 전체 실행</button>
    </div>
  </div>
</div>

<div class='row' style="padding-top: 5px; padding-bottom:0px; align-items: center;">
  <div class='col-sm-1 set-left'>
    <strong>상태</strong>
  </div>
  <div id='status_div' class="col-sm-11">
    대기중
  </div>
</div>


{{ macros.m_hr_head_top() }}
{{ macros.m_row_start('0') }}
{{ macros.m_col(12,  macros.m_strong('Log')) }}
{{ macros.m_row_end() }}
{{ macros.m_hr_head_bottom() }}
<div id="list_div"></div>

<script type="text/javascript">
var package_name = "{{arg['package_name'] }}";
var sub = "{{ arg['sub'] }}";
var current_data = null;

$(document).ready(function(){
  socket_init(package_name, sub);
  globalSendCommand('section_location', $('#library_select').val(), null, null, function(ret) {
    make_locations_list(ret);
  });
});

$("body").on('click', '#start0_btn', function(e){
  e.preventDefault();
  globalSendCommand('start0', $('#library_select').val(), $('#section_location').val());
});

$("body").on('click', '#start2_btn', function(e){
  e.preventDefault();
  globalSendCommand('start2', $('#library_select').val(), $('#section_location').val());
});

$("body").on('click', '#start3_btn', function(e){
  e.preventDefault();
  globalSendCommand('start3', $('#library_select').val(), $('#section_location').val());
});

$("body").on('click', '#start1_btn', function(e){
  e.preventDefault();
  globalSendCommand('start1', $('#library_select').val(), $('#section_location').val());
});

$("body").on('click', '#stop_btn', function(e){
  e.preventDefault();
  globalSendCommand('stop');
});


$("body").on('change', '#library_select', function(e){
  e.preventDefault();
  globalSendCommand('section_location', $('#library_select').val(), null, null, function(ret) {
    make_locations_list(ret);
  });
});

function make_locations_list(data) {
  data = data.data;
  str = '<select id="section_location" name="section_location" class="form-control form-control-sm">';
  str += '<option value="all">전체</option>';
  for (i in data) {
    str += '<option value="'+ data[i].root_path +'">'+data[i].root_path+'</option>';
  }
  str += '</select>';
  $('#section_location_div').html(str);
}



function make_one(data) {
  row = '';
  if (data.mode == 'db') {
    ret_type = (data.ret && data.ret.log_type) ? data.ret.log_type : '';
    if (ret_type == 'DEAD') {
      row += j_info_text("구분", text_color("[죽은 자막 정리]", 'red'));
      row += j_info_text("컨텐츠 제목", text_color(data.title, 'blue'));
      row += j_info_text("비디오 파일", data.video_file);
      row += j_info_text("삭제된 자막 경로", text_color(data.dead_subtitle_path, 'red'));
      row += j_info_text("조치 내용", text_color("디스크 파일 부존재 확인 -> 쇼/영화 메타 새로고침 대기열 등록", 'gray'));
    } else if (ret_type == 'MISSING_KOREAN') {
      row += j_info_text("구분", text_color("[외화 한글자막 누락]", 'orange'));
      row += j_info_text("컨텐츠 제목", text_color(data.title, 'blue'));
      row += j_info_text("비디오 파일", data.video_file);
      if (data.hardsub_tag) {
        row += j_info_text("진단 결과", text_color("한글 자막 없음 ", 'darkorange') + text_color(`[파일명 '${data.hardsub_tag}' 감지: 영상 자체자막일 가능성 있음]`, 'teal'));
      } else {
        row += j_info_text("진단 결과", text_color("한글 자막 없음 (외부/내부 한글 자막 및 디스크 자막 부재)", 'darkorange'));
      }
    } else if (ret_type == 'FOUND_DISK_SUB') {
      row += j_info_text("구분", text_color("[디스크 자막 발견 및 새로고침]", 'teal'));
      row += j_info_text("컨텐츠 제목", text_color(data.title, 'blue'));
      row += j_info_text("비디오 파일", data.video_file);
      row += j_info_text("발견된 자막 파일", text_color(data.found_sub_path, 'green'));
      row += j_info_text("조치 내용", text_color("영상 폴더에 자막 파일 존재 확인 -> Plex 메타 새로고침 즉시 지시 완료", 'darkcyan'));
    } else if (ret_type == 'REFRESH') {
      row += j_info_text("구분", text_color("[메타 새로고침]", 'green'));
      row += j_info_text("대상 제목", text_color(data.title, 'blue'));
      row += j_info_text("상세 안내", data.msg);
    } else {
      row += j_info_text("제목", data.title || '');
      row += j_info_text("결과", j_pre(JSON.stringify(data, null, 2)));
    }
    return row;
  }

  // 기존 파일시스템 기준
  row += j_info_text("폴더", data.dir);
  row += j_info_text("파일", data.filename);
  if (data.ret && data.ret.find_meta) {
    if (data.section_type == 'movie') {
      row += j_info_text('메타', text_color(data.meta_subtitle.title, 'blue'));
    } else {
      row += j_info_text('메타', text_color(data.meta_subtitle.show_title + ' 시즌:' + data.meta_subtitle.season_index + ' 에피소드:' + data.meta_subtitle.episode_index, 'blue'));
    }
  } else if (data.ret) {
    ret = 'DB에 자막 정보 없음. ';
    if (data.ret.find_video) {
      ret += '비디오 파일 있음. '
      row += j_info_text('비디오파일', data.ret.find_videofilename);
      if (data.ret.meta_by_videofile) {
        if (data.section_type == 'movie') {
          row += j_info_text('메타', text_color(data.meta_videofile.title, 'blue'));
        } else {
          row += j_info_text('비디오파일 메타', text_color(data.meta_videofile.show_title + ' 시즌:' + data.meta_videofile.season_index + ' 에피소드:' + data.meta_videofile.episode_index, 'blue'));
        }
      } else {
        ret += '비디오파일 메타 없음. '
      }
    } else {
      ret += '비디오 파일 없음. '
    }

    row += j_info_text('결과', text_color(ret));
    row += j_info_text('JSON', j_pre(JSON.stringify(data, null, 2)));    
  }

  if (data.smi2srt != null) {
    if (data.smi2srt['ret'] == 'success') {
      row += j_info_text('smi2srt 결과', '<pre>' + JSON.stringify(data.smi2srt) + '</pre>');
    } else {
      row += j_info_text('smi2srt 결과', '<pre>' + text_color(JSON.stringify(data.smi2srt, null, 2)) + '</pre>');
    }
  }
  return row;
}


function j_info_text2(key, value, empty=0, left=6) {
  row = '';
  if (empty !=0 ) row += j_col(empty, '', aligh='left');
  left = left - empty;
  right = 12 - empty - left;
  row += j_col(left, key, aligh='left');
  row += j_col(right, value, aligh='left');
  return row;
}


function make_status(data) {
  str = '';
  if (data.is_working == 'run')  tmp = '실행중';
  else if (data.is_working == 'stop')  tmp = '사용자 중지';
  else tmp = '대기중';
  str += j_row_start_hover();
  str += j_info_text2("상태", text_color(tmp));

  if (data.mode == 'db') {
    str += j_info_text2("진행 단계", text_color(data.current_step, 'blue'));

    if (data.sub_mode != 'missing_sub') {
      str += j_info_text2("외부 자막 검사", (data.db_checked_sub_count || 0) + ' / ' + (data.db_total_sub_count || 0));
      str += j_info_text2("정상 자막 수", text_color(data.db_normal_sub_count || 0, 'green'), 1);
      str += j_info_text2("죽은 자막 (디스크 없음)", text_color(data.db_dead_sub_count || 0, (data.db_dead_sub_count > 0 ? 'red' : 'black')), 1);
      str += j_info_text2("메타 새로고침 수", text_color(data.db_meta_refresh_count || 0, 'primary'), 1);
    }

    if (data.sub_mode != 'dead_sub') {
      if (data.db_total_media_count > 0 || data.db_checked_media_count > 0 || data.sub_mode == 'missing_sub') {
        str += j_info_text2("영상 미디어 검사", (data.db_checked_media_count || 0) + ' / ' + (data.db_total_media_count || 0));
        str += j_info_text2("디스크 자막 발견 (새로고침)", text_color(data.db_found_disk_sub_count || 0, 'info'), 1);
        str += j_info_text2("외화 한글자막 누락", text_color(data.db_missing_korean_count || 0, (data.db_missing_korean_count > 0 ? 'danger' : 'black')), 1);
        if (data.db_hardsub_count > 0) {
          str += j_info_text2("- 자체자막(SW/ST/KOR) 추정", text_color(data.db_hardsub_count || 0, 'teal'), 2);
        }
        if (data.sub_mode == 'missing_sub') {
          str += j_info_text2("메타 새로고침 수", text_color(data.db_meta_refresh_count || 0, 'primary'), 1);
        }
      }
    }
  } else if (data.subtitle_count != null) {
    str += j_info_text2("자막파일 수", data.subtitle_count);
    str += j_info_text2("DB에 자막 정보 있음", data.subtitle_exist_in_meta_count);
    str += j_info_text2("DB에 자막 정보 없음", data.not_subtitle_exist_in_meta_count);
    str += j_info_text2("자막에 맞는 비디오 파일 없음", data.not_videofile_exist_count, 1);
    str += j_info_text2("자막에 맞는 비디오 파일 있음", data.videofile_exist_count, 1);
    str += j_info_text2("비디오 파일이 DB에 없음 - 스캔", text_color(data.videofile_exist_not_in_meta_count), 2);
    str += j_info_text2("비디오 파일이 DB에 있음 - 메타새로고침", text_color(data.videofile_exist_in_meta_count), 2);
    str += j_info_text2('smi 파일 수', data.smi_count);
    str += j_info_text2('변환 후 메타새로고침', data.smi2srt_count, 1);
    str += j_info_text2('Show 단위 메타새로고침 수', data.meta_refresh_show_count);
  }
  str += j_row_end();
  $('#status_div').html(str);
}



function socket_init(package_name, sub) {
  var socket = io.connect(window.location.href);

  socket.on('start', function(data){
    globalSendCommand('refresh');
  });

  socket.on('refresh_all', function(data){
      make_list(data);
      make_status(data.status);
  });
  socket.on('refresh_status', function(data){
      make_status(data);
  });
  

  socket.on('refresh_one', function(data){
    make_status(data.status);
    if (!data.one) return;

    var one = make_one(data.one);
    var id = 'data_' + data.one.index;
    if ($('#' + id).length) {
      $('#' + id).html(one);
      if (current_data && current_data.list) {
        current_data.list[parseInt(data.one.index)] = data.one;
      }
    } else {
      var itemHtml = '<div id="' + id + '" style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #666;">' + one + '</div>';
      $('#list_div').prepend(itemHtml);

      // DOM 노드 200개 초과 시 오래된 노드 삭제 (메모리 및 브라우저 프리징 방지)
      if ($('#list_div > div').length > 200) {
        $('#list_div > div:last-child').remove();
      }

      if (current_data == null) current_data = {};
      if (current_data.list == null) current_data.list = [];
      current_data.list.push(data.one);
    }
  });

}



function make_list(data2) {
  current_data = data2;
  data = data2.list;
  if (!data || data.length == 0) {
    document.getElementById("list_div").innerHTML = '';
    return;
  }
  // 최신 순으로 최대 200개만 표시하여 브라우저 과부하 방지
  var display_list = data.slice(-200).reverse();
  str = '';
  for (i in display_list) {
    row = make_one(display_list[i]);
    str += '<div id="data_' + display_list[i].index + '" style="margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed #666;">';
    str += row;
    str += '</div>';
  }
  document.getElementById("list_div").innerHTML = str;
}



$("body").on('click', '#open_filemanager_btn', function(e){
  e.preventDefault();
  path = $(this).data('path');
  url = window.location.protocol + "//" + document.domain + ":" + location.port + "/flaskfilemanager/?go=" + path;

  window.open(url, "_blank");
  
  
});





function j_pre(text) {
  return '<pre style="word-wrap: break-word;white-space: pre-wrap;white-space: -moz-pre-wrap;white-space: -pre-wrap;white-space: -o-pre-wrap;word-break:break-all;">'+text+'</pre>';
}










</script> 

{% endblock %}
