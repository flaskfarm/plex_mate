{% extends "base.html" %}
{% block content %}
<script src="{{ url_for('.static', filename='base.js') }}"></script>

<div class='row' style="padding-top: 5px; padding-bottom:5px; align-items: center;">
  <div class='col-sm-1 set-left'>
    <strong>Library</strong>
  </div>
  <div class="input-group col-sm-3">
    <select id="library_select" name="library_select" class="form-control form-control-sm">
      {% if arg['library_list'] is not none %}
      {% for item in arg['library_list'] %}
        {% if loop.counter == 0 %}
        <option value="{{ item['id'] }}" selected>{{item['name']}}</option>
        {% else %}
        <option value="{{ item['id'] }}">{{item['name']}}</option>
        {% endif %}
      {% endfor %}
      {% endif %}
    </select>
  </div>
  <div class="input-group col-sm" style="padding-left:0px; padding-top:5px">
    <div class="btn-group btn-group-sm flex-wrap mr-2" role="group" style="padding-left:5px; padding-top:0px">
      <button id="movie_stop_btn" class="btn btn-sm btn-outline-danger">중지</button>
      <button id="show_start_all_btn" class="btn btn-sm btn-outline-success">1~3단계 순차 실행</button>
      <button id="movie_start0_btn" class="btn btn-sm btn-outline-warning">쇼별 메타 크기만 확인</button>
      <button id="movie_start1_btn" class="btn btn-sm btn-outline-info">1단계 시작</button>
      <button id="movie_start21_btn" class="btn btn-sm btn-outline-info">2-1단계 시작</button>
      <button id="movie_start22_btn" class="btn btn-sm btn-outline-info">2-2단계 시작</button>
      <button id="movie_start3_btn" class="btn btn-sm btn-outline-info">3단계 시작</button>
      <!-- <button id="movie_start4_btn" class="btn btn-sm btn-outline-info">4단계 시작</button> -->
    </div>
  </div>
</div>
<div class='row' style="padding-top: 5px; padding-bottom:0px; align-items: center;">
  <div class='col-sm-1 set-left'>
    <strong>DryRun</strong>
  </div>
  <div class="input-group col-sm-1">
    <input id="dryrun" name="dryrun" class="form-control form-control-sm" type="checkbox" data-toggle="toggle" checked>
  </div>
  <div class='col-sm-1 set-left'>
    <strong>Remove orphans</strong>
  </div>
  <div class="input-group col-sm-1">
    <input id="remove_orphans" name="remove_orphans" class="form-control form-control-sm" type="checkbox" data-toggle="toggle">
  </div>
</div>
<div class='row' style="padding-top: 5px; padding-bottom:0px; align-items: center;"></div>
<div class='row' style="padding-top: 5px; padding-bottom:0px; align-items: center;">
  <div class='col-sm-1 set-left'>
    <strong>상태</strong>
  </div>
  <div id='status_div' class="col-sm-11">
    대기중
  </div>
</div>

{{ macros.m_hr_head_top() }}
{{ macros.m_row_start('0') }}
{{ macros.m_col(12,  macros.m_strong('Log')) }}
{{ macros.m_row_end() }}
{{ macros.m_hr_head_bottom() }}
<div id="list_div"></div>

<script type="text/javascript">
var STORAGE_KEY = 'pm_last_work_show';
var initial_last_work = null;
try {
  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) initial_last_work = JSON.parse(saved);
} catch(e) {}

var seq_state = {
  active: false,
  step_idx: 0,
  steps: ['start1', 'start21', 'start22', 'start3'],
  step_names: {'start1': '1단계', 'start21': '2-1단계', 'start22': '2-2단계', 'start3': '3단계'},
  section_name: '',
  manual_step_name: '',
  has_started_run: false,
  last_work: initial_last_work
};

function save_last_work(work) {
  seq_state.last_work = work;
  try {
    if (work) localStorage.setItem(STORAGE_KEY, JSON.stringify(work));
  } catch(e) {}
}

$(document).ready(function(){
  socket_init();
  if (seq_state.last_work) {
    var badge_html = ` <span style="font-size:13px; font-weight:normal; margin-left:12px; color:#28a745; background:rgba(40,167,69,0.15); padding:3px 8px; border-radius:4px; border:1px solid rgba(40,167,69,0.3);"><i class="fa fa-check-circle"></i> 직전 완료: <strong>[${seq_state.last_work.section_name}] ${seq_state.last_work.step_name}</strong> (${seq_state.last_work.time}) / 삭제: ${color(humanFileSize(seq_state.last_work.remove_size))}</span>`;
    $('#status_div').html('<h4>대기중' + badge_html + '</h4>');
  }
});

function safe_notify(msg, type) {
  try {
    if (typeof $.notify === 'function') {
      $.notify({message: msg}, {type: type || 'info'});
    } else if (typeof notify === 'function') {
      notify(msg, type);
    }
  } catch(e) {
    console.log('[Notify]', msg);
  }
}

$("body").on('click', '#show_start_all_btn', function(e){
  e.preventDefault();
  var sec_name = $('#library_select option:selected').text() || '선택 라이브러리';
  safe_notify(`<strong>[${sec_name}] 1~3단계 전체 순차 실행(서버 백엔드)</strong>을 시작합니다.<br>웹페이지를 닫아도 백그라운드에서 끝까지 자동 진행됩니다.`, 'success');
  globalSendCommandPage('start_all', $('#library_select').val(), $('#dryrun').is(":checked"), $('#remove_orphans').is(":checked"));
});

function make_one(data) {
  row = j_row_start_hover();
  row += make_log("제목", data.db.title);
  row += make_log("HASH / GUID", data.db.hash + ' - ' + data.db.guid);
  str = "크기 : " + color(humanFileSize(data.meta.total), 'blue');
  str += " / 삭제 : " + color(humanFileSize(data.meta.remove));
  row += make_log("Metadata", str);
  if (data.media != null) {
    str = "크기 : " + color(humanFileSize(data.media.total), 'blue');
    str += " / 삭제 : " + color(humanFileSize(data.media.remove));
    row += make_log("Media", str);
  }
  row += make_log("thumb", data.db.user_thumb_url);
  row += make_log("art", data.db.user_art_url);
  if (data.db.user_clear_logo_url)
    row += make_log("clear_logo", data.db.user_clear_logo_url);
  if (data.db.user_music_url)
    row += make_log("theme", data.db.user_music_url);
  row += make_log("", "");
  if (data.file_count != 0) {
    row += make_log("파일", '전체 파일 : ' + data.file_count + ' / 삭제 파일 : ' + data.remove_count);
  }
  for (var season_key in data.seasons){
    row += make_log("Season "+season_key+" thumb", data.seasons[season_key].db.user_thumb_url);
    tmp = "";
    for (var episode_key in data.seasons[season_key].episodes) {
      tmp += "Season " + season_key + " / Episode " + episode_key + " : " + data.seasons[season_key].episodes[episode_key].db.user_thumb_url + "<br>"
    }
    row += make_log("Season " + season_key, tmp);
  }
  row += j_row_end();
  return row;
}

function make_status(data) {
  str = '';
  if (data.is_working == 'run') {
    tmp = '실행중';
    if (data.seq_step) {
      tmp = `[순차실행 ${data.seq_step}] ` + tmp;
    }
  } else if (data.is_working == 'wait') {
    tmp = '대기중';
  } else if (data.is_working == 'stop') {
    tmp = '사용자 중지';
  }

  if (data.count != null) tmp += '(' + data.current + '/' + data.count + ') ';

  str += '<h4>' + tmp;
  if (data.total_size != null && data.total_size != 0) {
    str += ' / 전체크기 : ' + color(humanFileSize(data.total_size), 'blue');
    str += ' / 삭제크기 : ' + color(humanFileSize(data.remove_size));
  }

  // 서버에서 전달된 직전 작업 정보가 있으면 저장 및 localStorage 동기화
  if (data.last_work) {
    save_last_work(data.last_work);
  }

  // 직전 작업 정보 표시 (대기 중일 때 항상 표기)
  if (data.is_working == 'wait' && seq_state.last_work != null) {
    str += ` <span style="font-size:13px; font-weight:normal; margin-left:12px; color:#28a745; background:rgba(40,167,69,0.15); padding:3px 8px; border-radius:4px; border:1px solid rgba(40,167,69,0.3);">` +
           `<i class="fa fa-check-circle"></i> 직전 완료: <strong>[${seq_state.last_work.section_name}] ${seq_state.last_work.step_name}</strong> (${seq_state.last_work.time})` +
           ` / 삭제: ${color(humanFileSize(seq_state.last_work.remove_size))}` +
           `</span>`;
  }
  str += '</h4>';
  $('#status_div').html(str);
}

</script>
